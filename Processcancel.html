<style>
  /* ครอบ popup ให้กลางจอ */
  .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.4); /* พื้นหลังดำโปร่ง */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  .popup {
    height: 300px; /* ลดความสูงให้เหมาะกับเนื้อหาที่น้อยลง */
    background: #fff;
    border-radius: 70px;
    padding: 20px 50px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    width: 400px;
    text-align: center;
    position: relative;
    display: block; /* ตั้งให้แสดงเฉพาะ popup นี้เลย */
  }

  .popup img {
    /* สมมติว่าใช้ไฟล์ check.png หรือไอคอนอื่นที่คล้ายกัน */
    width: 150px;
    margin-bottom: -42px;
  }

  .popup h2 {
    font-size: 22px;
    margin: 30px 0 5px 0;
    font-weight: bold;
    color: #333;
  }

  .popup p {
    font-size: 16px;
    color: #555;
    margin-bottom: 40px; /* เพิ่มระยะห่างก่อนกลุ่มปุ่ม */
  }

  /* ไม่จำเป็นต้องมี detail-box สำหรับ Popup นี้ */

  .btn-group {
    display: flex;
    justify-content: space-between;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin: 0 5px;
    min-width: 120px; /* กำหนดความกว้างปุ่มขั้นต่ำ */
  }

  /* ปุ่ม "ยกเลิก" (ซ้าย) - ใช้สีแดงตามรูป */
  .btn-left {
    background: linear-gradient(145deg, #e9a1a1, #ff1717);
    color: white;
    box-shadow: 0 4px 10px rgba(255, 90, 90, 0.4);
  }

  .btn-left:hover {
    background: #e14d4d;
  }

  /* ปุ่ม "ยืนยัน" (ขวา) - ใช้สีฟ้าตามรูป */
  .btn-right {
    background: linear-gradient(145deg, #d8f0ff, #3bb4ff);
    color: white;
    box-shadow: 0 4px 10px rgba(77, 184, 255, 0.4);
  }

  .btn-right:hover {
    background: #309fe6;
  }
</style>

<div class="popup-overlay">
  <div class="popup" id="popup-cancel">
    <img src="./image/check.png" alt="Checkmark Icon" />
    <h2>ยกเลิกการจอง</h2>
    <p>คุณต้องการยกเลิกที่จอดรถ</p>

    <div class="btn-group">
      <button class="btn btn-left">ยกเลิก</button>
      <button class="btn btn-right">ยืนยัน</button>
    </div>
  </div>
</div>
